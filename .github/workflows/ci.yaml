name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed --line-length 120 packages
      - run: dart analyze --fatal-infos packages
      - run: dart test
        working-directory: packages/eddy
      - run: flutter test
        working-directory: packages/eddy_flutter
